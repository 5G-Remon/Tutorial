name: update prototypes.json

on:
  push:
    branches: [master]
    paths-ignore:
      - 'prototypes.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-prototypes.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prototypes.json
          git diff --staged --quiet || (git commit -m "update prototypes.json" && git push)